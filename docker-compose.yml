services:
  postgres:
    image: postgres:16-alpine
    container_name: mindtrack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindtrack}
      POSTGRES_DB: ${POSTGRES_DB:-mindtrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mindtrack_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mindtrack_pgdata:
