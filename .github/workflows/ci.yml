name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets guard (no .env / *.db / *.pid tracked)
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|\.db(-journal)?$|\.sqlite3?$|\.pid$' || true)
          # .env.example отсутствует в справочнике — любой .env запрещён
          if [ -n "$forbidden" ]; then
            echo "❌ Forbidden files tracked in git:"
            echo "$forbidden"
            exit 1
          fi
          echo "✅ No secrets or local DBs tracked"

  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build static export
        run: bun run build

      - name: Measure static bundle
        run: bun run check:bundle

      - name: Dependency audit
        # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3) has no patched release yet and only
        # reaches us through eslint-config-next at lint time. Drop the ignore once fixed.
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_PATH: /mindtrack
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:e2e
