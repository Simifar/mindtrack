name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run test
      - name: Build static export
        run: bun run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check static artifact
        run: |
          test -f out/index.html
          test -f out/tests/phq-9/index.html
          test -f out/manifest.webmanifest
          base_path="${{ steps.pages.outputs.base_path }}"
          if [ -n "$base_path" ] && ! grep -R -Fq "${base_path}/_next/" out --include='*.html'; then
            echo "Static HTML is missing the configured base path"
            exit 1
          fi
          if find out -type f \( -name '*.env' -o -name '*.db' -o -name '*.sqlite' -o -name '*.pid' \) | grep -q .; then
            echo "Forbidden local files found in static artifact"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
