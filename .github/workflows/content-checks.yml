name: Content checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun test
      - run: bun run validate-content
      - run: bun run build
      - run: bun run check-bundle
      - run: bun run build:pages --base-path /MindTrack --site-url https://example.github.io/MindTrack/
      - run: bun run check:pages
